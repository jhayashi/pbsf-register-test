<!DOCTYPE html>
<!-- APP_VERSION 1.00 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBSF Spring 2027 Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--cobalt:#2C2C74;--cobalt-d:#1e1e52;--ink:#1a2230;--muted:#5b6472;--line:#e4e8ef;
        --bg:#eef1f6;--ok:#0a7d38;--warn:#b23b0e;--chip:#eef3ff;--stripe:#635bff;}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{background:#fff;padding:16px 18px 0}
  .brand{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .brand img{width:78px;height:auto;flex:0 0 auto}
  .brand .bt{font-family:'Poppins',system-ui,-apple-system,sans-serif;font-weight:600;
    color:var(--cobalt);letter-spacing:.01em;line-height:1.15;font-size:1.18rem;
    text-transform:uppercase}
  .brand .bs{color:var(--muted);font-size:.74rem;margin-top:3px;text-transform:none;
    font-family:system-ui,-apple-system,sans-serif;font-weight:400}
  .rule{max-width:960px;margin:14px auto 0;border:0;border-top:2px solid var(--cobalt);opacity:.85}
  @media(max-width:420px){ .brand .bt{font-size:.9rem} .brand img{width:52px} }
  .proto{background:#fff8e6;border-bottom:1px solid #f0e2b8;color:#6b5410;font-size:.72rem;padding:7px 14px;text-align:center}
  .steps{display:flex;gap:4px;padding:12px 16px 0;max-width:960px;margin:0 auto}
  .dot{flex:1;height:5px;border-radius:3px;background:#d5dbe6}
  .dot.on{background:var(--cobalt)} .dot.done{background:var(--ok)}
  .wrap{max-width:960px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
  h2{margin:0 0 4px;font-size:1.05rem} .sub{color:var(--muted);font-size:.8rem;margin:0 0 14px}
  .q{margin-bottom:14px} label.qt{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem;margin-bottom:6px}
  .req{color:var(--warn)} .help{font-size:.74rem;color:var(--muted);margin:-2px 0 6px}
  /* :not([type=checkbox]) is load-bearing. The blanket rule gave the processing-support
     checkbox width:100%, 10px padding and a border, so inside its flex label it became a
     full-width bordered box with the tick stranded in the middle of it and the text shoved
     to the far right. A checkbox is not a text field and must not inherit text-field sizing. */
  input:not([type=checkbox]),select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:.92rem;background:#fff}
  input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin:0;accent-color:var(--cobalt);cursor:pointer}
  /* An opt-in, so it reads as a bounded choice rather than stray text between the
     step's sub-line and the total. align-items:flex-start keeps the box on the first
     line when the note wraps. */
  .supportbox{display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;
    border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;
    background:#fbfcfe}
  .supportbox:hover{border-color:var(--cobalt)}
  .supportbox:focus-within{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(40,50,140,.10)}
  .supportbox input[type=checkbox]{margin-top:2px}
  .sbtext{font-size:.88rem;line-height:1.35}
  .sbnote{display:inline-block;margin-top:3px;font-size:.74rem;color:var(--muted);line-height:1.35}
  input:focus,select:focus{outline:none;border-color:var(--cobalt)}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:120px;border:1.5px solid var(--line);border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-size:.9rem;user-select:none}
  .opt:focus{outline:2px solid var(--cobalt);outline-offset:2px}
  .opt.sel{border-color:var(--cobalt);background:var(--chip);color:var(--cobalt-d);font-weight:600}
  .chip{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:20px;background:#eaf1ff;color:var(--cobalt-d)}
  .chip.calc{background:#e7f7ec;color:var(--ok)}
  .lockmsg{font-size:.76rem;color:var(--cobalt-d);background:var(--chip);border-radius:8px;padding:8px 10px;margin-top:6px}
  .hidden{display:none}
  .feebox{border:1.5px dashed var(--cobalt);background:linear-gradient(135deg,#f5f8ff,#eef3ff);border-radius:12px;padding:14px;margin-top:6px}
  .frow{display:flex;justify-content:space-between;margin:4px 0;font-size:.9rem} .frow .rl{color:var(--muted)}
  .fee{font-size:1.7rem;font-weight:800;color:var(--cobalt-d)}
  .ferr{color:var(--warn);font-size:.72rem;margin-top:4px}
  .esugg{font-size:.8rem;margin-top:6px;color:#6b5410;background:#fff8e6;border:1px solid #f0e2b8;
    border-radius:8px;padding:7px 9px;line-height:1.5;overflow-wrap:anywhere}
  .esugg button{margin:2px 0 0 6px;font-size:.76rem;padding:3px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--cobalt);background:#fff;color:var(--cobalt);font-weight:600}
  .esugg button.keep{border-color:#d9c88f;color:#6b5410;font-weight:500}
  .revmail{margin-top:8px;padding:9px 11px;border-radius:10px;background:#f5f8ff;border:1px solid #dfe6f5;
    font-size:.88rem;line-height:1.5}
  .badfield{border-color:var(--warn)!important}
  .valerr{background:#fdece4;border:1px solid #f3c4ad;color:var(--warn);border-radius:10px;padding:10px;font-size:.82rem;margin-top:6px}
  .nav{display:flex;gap:10px;margin-top:16px}
  button{padding:12px;border:0;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer}
  .primary{background:var(--cobalt);color:#fff;flex:2} .primary:disabled{background:#c1c8d6;cursor:not-allowed}
  a.btnlink{display:block;padding:12px;border-radius:10px;font-size:.95rem;font-weight:700;text-align:center;text-decoration:none}
  .ghost{background:#eef1f6;color:var(--ink);flex:1}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:.85rem}
  .chk input{width:auto;margin-top:2px}
  .rev{font-size:.86rem;line-height:1.7} .rev b{color:var(--muted);font-weight:600}
  /* The donation is its own section, set apart above and below, so it never reads as part of
     the address or of the fee box -- and is unmistakably optional. */
  .donbox{margin:24px 0;padding:16px 16px 4px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
  .donhead{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.95rem;margin-bottom:6px}
  .dontext{font-size:.82rem;color:var(--muted);line-height:1.45;margin:0 0 12px}
  .donpicks{margin-bottom:14px} .donpicks .opt{min-width:64px;padding:10px 6px;font-weight:600}
  /* stripe */
  .stripe-head{display:flex;align-items:center;gap:8px;color:var(--stripe);font-weight:800;font-size:.9rem;margin-bottom:2px}
  .test-badge{background:#ffe9b3;color:#7a5a00;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
  .amt{font-size:2rem;font-weight:800;margin:6px 0 12px}
  .stripe-pay{background:var(--stripe);color:#fff;width:100%} .stripe-pay:disabled{opacity:.6}
  .succ{text-align:center;padding:8px}
  .succ .big{font-size:2.6rem} .succ .done{font-size:.95rem;margin:4px 0 14px}
  .badge-paid{display:inline-block;background:#e7f7ec;color:var(--ok);border:1px solid #b7e6c6;font-weight:800;padding:6px 14px;border-radius:20px;margin:8px 0}
  .cover{font-size:.9rem;line-height:1.65;color:#2c3542;max-width:82ch;margin:0 auto}
  .cover p{margin:0 0 11px} .cover ul{margin:0 0 11px 18px;padding:0}
  .divs{display:flex;gap:28px;flex-wrap:wrap}
  .divs>div{flex:1 1 300px;min-width:0}
  @media(max-width:560px){ .divs{gap:0} }
  .ptab{width:100%;border-collapse:collapse;font-size:.82rem;margin:0 0 8px}
  .ptab th,.ptab td{text-align:left;padding:5px 7px;border-bottom:1px solid #e6ebf1}
  .ptab th{font-weight:600;color:#4a5563;font-size:.7rem;text-transform:uppercase;
    letter-spacing:.03em;border-bottom-width:2px}
  .ptab th.p,.ptab td.p{text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .ptab .now{background:#eef8f0}
  .ptab td.past,.ptab th.past{color:var(--muted);text-decoration:line-through}
  .tnote{font-size:.74rem;color:var(--muted);margin:0 0 11px}
  .ferr:empty{display:none}
  .cover li{margin:2px 0}
  .wbody{max-height:170px;overflow-y:auto;background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.78rem;line-height:1.5;color:#38414f;margin-bottom:10px}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  button:focus-visible,a:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
  .rmbtn{flex:0;padding:6px 10px;font-size:.78rem}
  .foot{font-size:.7rem;color:var(--muted);text-align:center;padding:12px 0 20px}
  .enf{background:#eef8f0;border:1px solid #cfe9d6;border-radius:10px;padding:10px;font-size:.78rem;color:#12622f;margin-top:10px;text-align:left}
  .rrow{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .rrow span:last-child{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="https://static.wixstatic.com/media/25ff84_e3a5f88358f2474ba33de547f0bca0e1~mv2.png/v1/fill/w_220,h_172,al_c,q_85,enc_auto/PBSF-Logo-2020-clear_edited.png"
         alt="Piedmont Baseball Softball Foundation">
    <div><div class="bt">Piedmont Baseball Softball Foundation</div>
         <div class="bs">Spring 2027 &middot; Player Registration</div></div>
  </div>
  <hr class="rule">
</header>
<div class="proto">🧪 TEST MODE — payments here use Stripe's sandbox and take no real money. Registrations do not count.</div>
<div class="steps" id="steps"></div>
<div class="wrap"><div class="card" id="stage"></div>
<div class="foot">Piedmont Baseball Softball Foundation · Spring 2027 · fees are set by the league and calculated at checkout.</div></div>

<script>
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzgWN-nkhr1oa6xrSvMMsQOkBJSKciv4fHzPKctx7ccKO8TP_lmJSbryeI7aPODp4o37A/exec'; // <-- paste the Apps Script /exec URL
/* No Content-Type header => the browser sends text/plain => no CORS preflight, which
   Apps Script cannot answer. Apps Script reads the raw e.postData.contents.
   The response IS readable: /exec returns access-control-allow-origin:* on both the
   302 and the final googleusercontent response (measured 2026-07-28), so unlike the
   original prototype we no longer discard it -- the server's refusals are the only
   way the user learns why a submission failed.
   Division, fee and total are deliberately NOT sent. The server derives them. */
/* One id per submission ATTEMPT, not per request. Kept on the state object so a
   re-render cannot mint a new one -- render() rebuilds everything else on every state
   change, which is exactly how a per-request id would have crept in. */
function submissionId(){
  if(!s._submissionId) s._submissionId=uuid4();
  return s._submissionId;
}
function uuid4(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  // randomUUID needs a secure context. https everywhere in practice, but a fallback
  // costs one line and the server validates the shape either way.
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

/* Stripe Checkout REFUSES to be framed -- it fails to a blank box with no error -- and
   this form is pasted into a Wix Embed HTML element, so it is usually inside an iframe.
   Navigate the TOP window where the browser permits it, and degrade rather than trap a
   family who has a registration saved and no way to pay for it. */
/* A refused top-level navigation NEITHER throws NOR returns a value -- Chrome logs a
   violation and does nothing -- so failure here is undetectable by construction. The
   previous version caught nothing, returned true regardless, and the caller read that
   as success: the family sat on a disabled button reading "Taking you to payment…"
   with no link, no error and an empty console, registration saved PENDING and no way
   to pay it. That is the state the function exists to prevent.

   And it is the EXPECTED path, not an edge case. A cross-origin child may navigate the
   top frame only with TRANSIENT user activation, which Chrome expires after ~5s, and
   the click that starts this spends that budget waiting on a POST that writes N sheet
   rows, takes a script lock, and creates a Stripe Checkout Session. Apps Script
   round trips of 5-10s are ordinary. window.open needs the same activation, so the
   fallback expires with it.

   Hence: no return value. Callers paint the manual link BEFORE calling, and a
   navigation that works means nobody ever reads it. */
function goToCheckout(url){
  // Server-controlled today; a scheme check is free and stops a javascript: URL ever
  // reaching location.href if that ever stops being true.
  if(!/^https:\/\/[a-z0-9.-]+\.stripe\.com\//.test(url)) return;
  try{
    if(window.top&&window.top!==window.self){ window.top.location.href=url; return; }
  }catch(e){ /* cross-origin: top is not ours to navigate */ }
  /* ONLY when we are not framed. Navigating the frame itself loads Checkout inside the
     Wix embed, which Stripe refuses to be framed in -- a blank box with no error, which
     is strictly worse than doing nothing and leaving the family the link. */
  if(window.top===window.self){ try{ window.location.href=url; return; }catch(e2){} }
  window.open(url,'_blank','noopener');
}

function submitToBackend(){
  var payload={
    env:ENV, formVersion:FORM_VERSION, donation:donationNum(),
    /* Generated ONCE, when the family first reaches submit, and reused on every retry.
       A double-click or a retry-after-timeout then dedupes to one registration instead
       of two -- and the server refuses anything that is not a v4 UUID, so nobody can
       later derive it from an email and make it guessable. */
    submissionId:submissionId(),
    /* Our own URL, so the server can build success_url from it. It validates against an
       allowlist and falls back on rejection -- the client does not get to choose where
       a paying family lands. */
    returnUrl:location.href,
    support:s.support?1:0,
    shared:withNormalZip(s.shared),
    players:s.players.map(function(p){
      /* sport is sent as chosen; the server re-derives it (boys are baseball only)
         and re-derives the division from sport+grade. Division, fee and total are
         deliberately absent -- sending them would invite trusting them. */
      return { first:p.first, last:p.last, dob:normalizeDob(p.dob)||p.dob, gender:p.gender, sport:p.sport,
               /* Names only -- a request the server checks against eligibility. */
               programs:pPrograms(p).map(function(x){ return x.division; }),
               grade:p.grade, school:p.school, shirt:p.shirt,
               considerCoaching:p.considerCoaching, friendRequest:p.friendRequest,
               notes:p.notes };
    }),
    waivers:s.waivers
  };
  if(NOW_OVERRIDE) payload.now=NOW_OVERRIDE;
  return fetch(BACKEND_URL,{method:'POST',body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return {ok:false,error:'Could not reach the registration server.'}; });
}

/* Fail closed. A stale price shown during an outage is worse than no form at all,
   and falling back to a built-in table would reintroduce the duplication that having
   one server-side fee table exists to remove. */
/* The three ways a family arrives back from Stripe. Handled BEFORE the version gate
   below, and that ordering is the whole point: registration.html is served from a
   content-addressed URL that never changes, so after any FORM_VERSION bump an
   in-flight payment returns to a page that would otherwise refuse to render -- telling
   someone who has just been charged to start again. A page that only DISPLAYS a result
   runs no pricing logic and needs no version guard. */
function returnParams(){
  return { sessionId: QS.get('session_id'),
           groupId: QS.get('groupId'),
           /* payment=resume is the email's "Complete your payment" link (resumeLink in
              Pricing.gs): the same screen as Stripe's cancel, without the word. */
           cancelled: QS.get('payment')==='cancelled'||QS.get('payment')==='resume' };
}

function showReceipt(stage, data){
  /* Rendered ONLY from the server's response. Wizard state does not survive the
     redirect -- this is a fresh top-level page load, so s.players and total() are
     empty -- and building the receipt from them is the exact shape CLAUDE.md records
     from Task 5: a path nothing exercises, built from fields that are no longer there. */
  var lines=(data.players||[]).map(function(p){
    return '<div class="rrow"><span>'+esc(p.name)+' &middot; '+esc(divLabel(p.division))+
           (p.comboDiscount>0?' (2nd program)':'')+'</span>'+
           '<span>'+money(p.listFee)+'</span></div>';
  }).join('');
  var a=data.amounts||{};
  function row(label,cents){ return cents>0
    ? '<div class="rrow"><span>'+label+'</span><span>'+money(cents)+'</span></div>' : ''; }
  /* "Payment received" alone left a family wondering whether anything was still to do
     (Adam Schwartz, 2026-10-28), so the heading says what the payment achieved. Only this
     screen may say it: the server answered ok, so the rows are PAID. The fallbacks in
     handleReturn cannot establish that and must not borrow this wording. */
  stage.innerHTML='<div class="succ"><div class="big">🎉</div>'+
    '<h2>You&rsquo;re registered!</h2>'+
    '<div class="badge-paid">'+money(a.total)+' paid</div>'+
    '<p class="done"><b>Payment received, and your registration is complete.</b> '+
    'There&rsquo;s nothing more you need to do.</p>'+
    '<div class="enf" style="text-align:left">'+lines+
      row('Donation to PBSF',a.donation)+
      row(data.processingMandatory?'Processing fee':'Processing support',a.processingSupport)+
      (a.discount>0?'<div class="rrow"><span>Financial aid'+
        (data.couponCode?' ('+esc(data.couponCode)+')':'')+'</span><span>&minus;'+
        money(a.discount)+'</span></div>':'')+
      '<div class="rrow" style="font-weight:700;border-top:1px solid #ccc;margin-top:6px;'+
      'padding-top:6px"><span>Total paid</span><span>'+money(a.total)+'</span></div>'+
    '</div>'+
    (data.receiptTaxNote?'<p class="sub">'+esc(data.receiptTaxNote)+'</p>':'')+
    '<p class="sub">A confirmation email is on its way. Questions: <a href="mailto:'+
    esc(data.registrarEmail)+'">'+esc(data.registrarEmail)+'</a></p>'+
    '<p class="sub" style="font-size:12px">Reference: '+esc(data.groupId)+'</p></div>';
}

function money(cents){
  var n=Math.round(Number(cents)||0);
  return '$'+(n/100).toFixed(2).replace(/\.00$/,'');
}

function handleReturn(stage){
  var rp=returnParams();
  if(rp.sessionId){
    stage.innerHTML='<h2>Confirming your payment…</h2>'+
      '<p class="sub">One moment. Do not close this page.</p>';
    fetch(BACKEND_URL,{method:'POST',body:JSON.stringify(
      {env:ENV,action:'confirm',sessionId:rp.sessionId})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){ showReceipt(stage,d); return; }
        /* THE SERVER KNOWS WHETHER MONEY ARRIVED, so ask it rather than assuming.
           pending:true means Stripe says the session is not complete -- the family did
           NOT pay, and telling them "payment received" would be a lie they act on. An
           earlier version showed the reassuring message for every non-ok response and
           did exactly that for an abandoned checkout. */
        if(d&&d.pending){
          stage.innerHTML='<h2>Your registration is saved</h2>'+
            '<p class="sub">We have not received a payment for it yet, and you have not '+
            'been charged.</p>'+
            '<button class="primary" id="resumeBtn" style="width:100%">Continue to '+
            'payment</button><div id="resumeErr"></div>';
          if(rp.groupId) wireResume(rp.groupId);
          return;
        }
        /* Anything else: confirmation failed but the money MAY have moved -- a network
           error, a lock timeout, a wrong-mode key. Never show a failure that implies
           they were not charged; the reconciler catches it within 30 minutes. */
        stage.innerHTML='<h2>Payment received</h2><p class="sub">We are still confirming '+
          'it with our records. Your confirmation email will arrive shortly &mdash; there '+
          'is nothing more for you to do. If it has not arrived within an hour, contact '+
          '<a href="mailto:info@piedmontbaseball.org">info@piedmontbaseball.org</a> '+
          'quoting '+esc(rp.groupId||rp.sessionId)+'.</p>';
      })
      .catch(function(){
        /* Fires on any fetch rejection AND on any non-JSON body -- so a stale Apps
           Script deployment serving an HTML error page sends EVERY returning family
           here. It must not assert a fact it cannot establish ("your payment went
           through"), and unlike the branch above it used to hand them no reference at
           all, leaving nothing to quote to support. Keep the reassurance -- never imply
           they were not charged -- drop the claim, carry the reference. */
        stage.innerHTML='<h2>Payment received</h2><p class="sub">We could not reach our '+
          'server to confirm it just now. Your confirmation email will follow &mdash; '+
          'there is nothing more for you to do. If it has not arrived within an hour, '+
          'contact <a href="mailto:info@piedmontbaseball.org">info@piedmontbaseball.org</a> '+
          'quoting '+esc(rp.groupId||rp.sessionId)+'.</p>';
      });
    return true;
  }
  if(rp.cancelled&&rp.groupId){
    stage.innerHTML='<h2>Your registration is saved</h2>'+
      '<p class="sub">You have not been charged. Finish paying whenever you are ready '+
      '&mdash; nothing is lost.</p>'+
      '<button class="primary" id="resumeBtn" style="width:100%">Continue to payment</button>'+
      '<div id="resumeErr"></div>';
    wireResume(rp.groupId);
    return true;
  }
  return false;
}

function wireResume(groupId){
  var rp={groupId:groupId};
  document.getElementById('resumeBtn').onclick=function(){
      var b=this; b.disabled=true; b.textContent='One moment…';
      /* quote first: it creates nothing and returns the amount, so a family whose
         price moved sees the new figure BEFORE anything charges them. */
      fetch(BACKEND_URL,{method:'POST',body:JSON.stringify(
        {env:ENV,action:'quote',groupId:rp.groupId})})
        .then(function(r){return r.json();})
        .then(function(q){
          if(!q||!q.ok) throw new Error((q&&q.error)||'Could not load your registration.');
          return fetch(BACKEND_URL,{method:'POST',body:JSON.stringify(
            {env:ENV,action:'pay',groupId:rp.groupId,
             quotedTotalCents:q.quotedTotalCents,returnUrl:location.href})})
            .then(function(r){return r.json();});
        })
        .then(function(d){
          if(d&&d.ok&&d.checkoutUrl){
            /* Same silent-refusal problem as submit, and worse here: this branch used
               to return unconditionally, leaving the button disabled on "One moment…"
               with no link and no error. Paint the escape hatch, then navigate. */
            document.getElementById('resumeErr').innerHTML='<div class="enf" '+
              'style="text-align:left">If you are not taken to the payment page '+
              'automatically, <a href="'+esc(d.checkoutUrl)+'" target="_top" '+
              'rel="noopener">open it here</a>.</div>';
            b.disabled=false; b.textContent='Continue to payment';
            goToCheckout(d.checkoutUrl); return;
          }
          if(d&&d.repriced){
            document.getElementById('resumeErr').innerHTML='<div class="enf" '+
              'style="text-align:left">'+esc(d.message)+' The amount is now <b>'+
              money(d.quotedTotalCents)+'</b>. Press Continue again to pay it.</div>';
            b.disabled=false; b.textContent='Continue to payment'; return;
          }
          throw new Error((d&&d.error)||'Could not start payment.');
        })
        .catch(function(e){
          document.getElementById('resumeErr').innerHTML=
            '<div class="valerr">'+esc(e.message)+'</div>';
          b.disabled=false; b.textContent='Continue to payment';
        });
    };
}

function boot(){
  var stage=document.getElementById('stage');
  /* BEFORE handleReturn, because the return screens never reach the config fetch and
     renderBanner used to live only inside it -- so the hardcoded TEST MODE markup
     ("registrations here do not count") rendered above the receipt of every family who
     had just paid, in production, 100% of the time. renderBanner is CFG-free, and
     success_url/cancel_url always carry &env=, so ENV_EXPLICIT is true here. */
  renderBanner();
  // BEFORE the config fetch and before the version gate. See handleReturn.
  if(handleReturn(stage)) return;
  stage.innerHTML='<h2>Loading…</h2><p class="sub">Fetching current registration fees.</p>';
  var u=BACKEND_URL+'?env='+ENV+(NOW_OVERRIDE?'&now='+encodeURIComponent(NOW_OVERRIDE):'');
  fetch(u).then(function(r){ return r.json(); }).then(function(c){
    if(!c||!c.ok) throw new Error('bad config');
    CFG=c;
    renderBanner();
    if(c.formVersion!==FORM_VERSION){
      var framed=true; try{ framed=(window.top!==window.self); }catch(e){}
      var store=null; try{ store=window.sessionStorage; }catch(e){}
      var home=(location.hostname===TEST_HOST)?TEST_FORM_URL:CURRENT_FORM_URL;
      var fwd=staleFormForward({ framed:framed, search:location.search, storage:store,
                                 env:ENV, explicit:ENV_EXPLICIT, nowMs:Date.now(), formUrl:home });
      if(fwd){
        stage.innerHTML='<h2>Opening the current form…</h2><p class="sub">This copy is out of '+
          'date. If nothing happens, <a href="'+fwd+'">open the current form</a>.</p>';
        location.replace(fwd);
        return;
      }
      stage.innerHTML=staleFormScreen(home);
      return;
    }
    if(!CFG.open){
      stage.innerHTML='<h2>Registration is closed</h2><p class="sub">Spring 2027 registration is no '+
        'longer accepting entries. Questions: <a href="mailto:'+CFG.registrarEmail+'">'+
        CFG.registrarEmail+'</a></p>';
      return;
    }
    render();
  }).catch(function(){
    renderBanner();
    stage.innerHTML='<h2>Registration is temporarily unavailable</h2>'+
      '<p class="sub">We could not load current fees. Please try again in a few minutes.</p>';
  });
}

/* Issue #42: a stale copy -- its FORM_VERSION no longer matches the backend's -- sends the
   family to the current form on load, before they have typed anything, instead of
   dead-ending them (PBSF Registrar, 2026-10-27). The submit-time check in Code.gs still only
   returns its message: by then the family has typed everything, and forwarding would lose it.
   - TOP LEVEL ONLY. Framed in the Wix embed, location.replace would load the live form inside
     a test-mode embed; there the message carries a target=_top button instead, which a click
     is allowed to use to leave the frame.
   - AT MOST ONCE. The forward adds fwd=<ms>, which also gets past the browser's and the CDN's
     caches (Pages serves max-age=600, so a plain reload can hand back this same stale copy).
     A page that arrives with fwd=, or inside the session guard, shows the message instead of
     forwarding again: right after a version bump, before the new form is published, every copy
     is stale, and a second hop would be a loop. Storage that throws (some private modes)
     means no forward at all -- a message is never worse than a loop.
   - Explicit test mode (env=test, and now=) survives the hop, so a tester stays in the
     sandbox; anything else lands on the plain, live address.
   Returns the URL to replace() to, or null to show staleFormScreen(). */
var CURRENT_FORM_URL='https://register.piedmontbaseball.org/';
var TEST_FORM_URL='https://register-test.piedmontbaseball.org/';   // a stale DEV copy goes here
function staleFormForward(o){
  if(o.framed||!o.storage) return null;
  var qs=new URLSearchParams(o.search||'');
  if(qs.get('fwd')) return null;
  try{
    var last=Number(o.storage.getItem('pbsfStaleForward')||0);
    if(last&&o.nowMs-last<30*60*1000) return null;
    o.storage.setItem('pbsfStaleForward',String(o.nowMs));
  }catch(e){ return null; }
  var q=[];
  if(o.env==='test'&&o.explicit){
    q.push('env=test');
    if(qs.get('now')) q.push('now='+encodeURIComponent(qs.get('now')));
  }
  q.push('fwd='+o.nowMs);
  return (o.formUrl||CURRENT_FORM_URL)+'?'+q.join('&');
}
function staleFormScreen(formUrl){
  var u=formUrl||CURRENT_FORM_URL;
  return '<h2>This form is out of date</h2><p class="sub">You may be viewing a saved copy. '+
    'Please start again from <a href="'+u+'" target="_top">'+
    u.replace(/^https:\/\/|\/$/g,'')+'</a>.</p>'+
    '<div class="nav"><a class="primary btnlink" href="'+u+'" target="_top">'+
    'Go to the current form</a></div>';
}

/* ---- Program eligibility and the combo discount: COPIED VERBATIM from Pricing.gs.
   test/spring.test.js asserts each function here is character-for-character the
   server's, so the price a family is shown cannot drift from the price they are
   charged. Edit Pricing.gs, then re-copy. Never edit these here. ---- */
function gradeKey(grade) {
  if (typeof grade !== 'number' && typeof grade !== 'string') return null;
  var g = String(grade);
  return /^(PK|K|[1-8])$/.test(g) ? g : null;
}
function divisionFor(sport, grade, cfg) {
  var table = (cfg.divisions || {})[sport];
  if (!table) return null;
  var g = gradeKey(grade);
  return g === null ? null : (table[g] || null);
}
function eligiblePrograms(player, cfg) {
  var p = player || {}, out = [], g = gradeKey(p.grade);
  if (g === null) return out;
  var bb = divisionFor('Baseball', g, cfg);
  if (bb && (p.gender === 'Male' || p.gender === 'Female')) {
    out.push({ division: bb, sport: 'Baseball', school: false });
  }
  var sb = (p.gender === 'Female') ? divisionFor('Softball', g, cfg) : null;
  if (sb) out.push({ division: sb, sport: 'Softball', school: false });
  var sp = cfg.schoolPrograms || {};
  for (var name in sp) {
    var r = sp[name];
    if (r.gender === p.gender && (r.grades || []).indexOf(g) >= 0 &&
        String(p.school || '') === r.school) {
      out.push({ division: name, sport: r.sport, school: true });
    }
  }
  return out;
}
function isMultiProgramGrade(grade, cfg) {
  var g = gradeKey(grade);
  return g !== null && (cfg.multiProgramGrades || []).indexOf(g) >= 0;
}
function programMixProblem(programs) {
  var rec = 0, school = 0;
  for (var i = 0; i < programs.length; i++) {
    if (programs[i].school) school++; else rec++;
  }
  if (!programs.length) return 'pick at least one program';
  if (rec > 1) return 'only one rec program per player';
  if (school > 1) return 'only one school program per player';
  return null;
}
function comboDiscountIndex(programs, fees, cfg) {
  if (!(cfg.comboDiscountPercent > 0)) return -1;
  var hasSchool = false, hasRec = false, i;
  for (i = 0; i < programs.length; i++) {
    if (programs[i].school) hasSchool = true; else hasRec = true;
  }
  if (!hasSchool || !hasRec) return -1;
  var best = -1;
  for (i = 0; i < programs.length; i++) {
    if (best < 0 || fees[i] < fees[best] ||
        (fees[i] === fees[best] && programs[i].school && !programs[best].school)) best = i;
  }
  return best;
}
function comboDiscountCents(feeCents, cfg) {
  return Math.round(feeCents * (cfg.comboDiscountPercent || 0) / 100);
}
function processingSupportCents(cents, cfg) {
  var amount = Math.round(Number(cents) || 0);
  if (amount <= 0) return 0;
  var rate = cfg.processingFeeRate, fixed = cfg.processingFeeFixedCents;

  // The algebra gives the real-valued answer; Stripe then charges an INTEGER fee it
  // rounds itself, so the algebraic ceiling can overshoot by a cent. On $275 the
  // closed form yields 853 while 852 already nets exactly $275.00 -- caught by the
  // golden, which is the argument for keeping goldens next to a formula.
  //
  // So: start below and walk up to the SMALLEST addition that leaves the league
  // whole. Bounded to a few iterations, and exact by construction rather than by
  // rounding luck.
  var add = Math.floor((amount + fixed) / (1 - rate)) - amount - 1;
  if (add < 0) add = 0;
  for (var i = 0; i < 8; i++) {
    var charge = amount + add;
    var net = charge - (Math.round(charge * rate) + fixed);
    if (net >= amount) return add;
    add++;
  }
  return add;
}
function mandatoryProcessingCents(baseCents, cfg) {
  var exact = processingSupportCents(baseCents, cfg);
  var step = Math.round(Number(cfg.processingFeeRoundToCents) || 1);
  if (step < 1) step = 1;
  return Math.ceil(exact / step) * step;
}/* ---- end of the verbatim copy ---- */

/* What a family READS for a division. Display only: the division KEY ("PMS Baseball") is
   what config, the Stripe product map, the payload and the sheet use, and it never
   changes here. Parents did not all know "PMS" meant Piedmont Middle School. */
var DIVISION_LABELS={'PMS Baseball':'PMS (Piedmont Middle School) Baseball',
                     'PMS Softball':'PMS (Piedmont Middle School) Softball'};
function divLabel(d){ return DIVISION_LABELS[d]||d; }
function pSport(p){ return p.gender==='Male'?'Baseball':p.sport; }
/* The sport the form picks for a child before the parent does: boys play baseball, and
   girls default to SOFTBALL -- most girls here play it -- except where this grade has no
   softball division (Pre-K: softball starts at 6U in K), where it is baseball (Shetland).
   With no grade yet, softball. A default only; a girl can always switch to baseball. */
function autoSport(gender,grade,cfg){
  if(gender==='Male') return 'Baseball';
  if(gender!=='Female') return null;
  return (gradeKey(grade)!==null&&!divisionFor('Softball',grade,cfg))?'Baseball':'Softball';
}
/* Apply that default -- but never over a sport the parent picked themselves. sportAuto
   records which it is, so switching Male->Female replaces the automatic Baseball, a grade
   change re-derives an automatic choice (K softball -> Pre-K baseball), and a parent's own
   tap survives both. Boys are forced to Baseball; a girl's own Baseball choice is kept
   marked as hers, so a slip to Male and back does not lose it. */
function applyAutoSport(p){
  if(p.gender==='Male'){ if(p.sport!=='Baseball'){ p.sport='Baseball'; p.sportAuto=true; } return; }
  /* Leaving program mode (e.g. the school changed away from PMS): a rec program the parent
     ticked there IS their sport choice -- carry it over rather than defaulting a Pony girl
     to Softball behind their back. */
  if(p.gender==='Female'&&p.programs&&p.programs.length&&!pMulti(p)){
    var g=gradeKey(p.grade), bb=divisionFor('Baseball',g,CFG), sb=divisionFor('Softball',g,CFG);
    for(var i=0;i<p.programs.length;i++){
      if(p.programs[i]===bb||p.programs[i]===sb){
        p.sport=(p.programs[i]===bb)?'Baseball':'Softball'; p.sportAuto=false; p.programs=[]; return; }
    }
  }
  if(p.gender==='Female'&&(!p.sport||p.sportAuto)){
    p.sport=autoSport('Female',p.grade,CFG); p.sportAuto=true; }
}
function pDivision(p){ var sp=pSport(p); if(!sp||!p.grade||!CFG) return null;
  return divisionFor(sp,p.grade,CFG); }
/* Does this child tick programs rather than pick one sport? Only in a multi-program grade
   AND only when a school program is on offer: without one, a child has one rec program,
   which is just the ordinary sport choice. */
function pMulti(p){ if(!(CFG&&p.gender&&isMultiProgramGrade(p.grade,CFG))) return false;
  var el=eligiblePrograms(p,CFG);
  for(var i=0;i<el.length;i++) if(el[i].school) return true;
  return false; }
/* The programs this child is registering for: [{division,sport,school}]. */
function pPrograms(p){
  if(!CFG||!p.gender||gradeKey(p.grade)===null) return [];
  if(pMulti(p)){
    var el=eligiblePrograms(p,CFG), want=p.programs||[], out=[];
    for(var i=0;i<el.length;i++) if(want.indexOf(el[i].division)>=0) out.push(el[i]);
    return out;
  }
  var sp=pSport(p), d=sp?divisionFor(sp,p.grade,CFG):null;
  return d?[{division:d,sport:sp,school:false}]:[];
}
/* One line per program, in cents, with the combo discount applied the server's way. */
function pEntries(p){
  var pr=pPrograms(p), fees=[], out=[], i;
  if(programMixProblem(pr)) return [];   // the server refuses it, so it is never quoted
  for(i=0;i<pr.length;i++) fees.push(CFG.fees[pr[i].division]);
  var disc=comboDiscountIndex(pr,fees,CFG);
  for(i=0;i<pr.length;i++){
    var c=Math.round((fees[i]||0)*100), off=(i===disc)?comboDiscountCents(c,CFG):0;
    out.push({division:pr[i].division,sport:pr[i].sport,cents:c-off,off:off});
  }
  return out;
}
function pFeeCents(p){ return pEntries(p).reduce(function(t,e){ return t+e.cents; },0); }
function entryCount(){ return s.players.reduce(function(t,p){ return t+pEntries(p).length; },0); }
/* Spring's required processing fee: Stripe's exact cost on the whole order, rounded up to

   support box is gone. It moves with the donation, so it is recomputed on every paint. */
function procMandatory(){ return !!(CFG&&CFG.processingFeeMandatory); }
function procCents(){ return procMandatory()
  ?mandatoryProcessingCents(subtotalCents()+Math.round(donationNum()*100),CFG):0; }
function totalCents(){ return subtotalCents()+Math.round(donationNum()*100)+procCents(); }
/* Every program line, plus the processing fee -- the review step and its in-place repaint
   share this so the two can never disagree. */
function entryLines(){
  var h='';
  for(var j=0;j<s.players.length;j++){ var q=s.players[j], es=pEntries(q);
    for(var k=0;k<es.length;k++){
      h+='<div class="frow"><span class="rl">'+esc(q.first)+' '+esc(q.last)+' &middot; '+
        esc(divLabel(es[k].division))+(es[k].off?' <span class="chip">2nd program &minus;'+
        CFG.comboDiscountPercent+'%</span>':'')+'</span><span>'+money(es[k].cents)+
        '</span></div>';
    }
  }
  if(procCents()) h+='<div class="frow"><span class="rl">Processing fee &middot; card '+
    'processing cost</span><span>'+money(procCents())+'</span></div>';
  return h;
}
/* The tier is resolved server-side; the client only reports it. tierEndsAtLabel is
   preformatted by the server because a browser would render the -07:00 offset in its
   own timezone and show an out-of-state family the wrong deadline. */
function tierNote(){
  if(!CFG) return '';
  if(CFG.tier==='early') return '<div class="frow"><span class="rl">Early bird</span>'+
    '<span style="color:var(--ok);font-weight:700">saves $'+Math.abs(CFG.tierAdjust)+
    (CFG.tierEndsAtLabel?' &middot; ends '+CFG.tierEndsAtLabel:'')+'</span></div>';
  if(CFG.tier==='late') return '<div class="frow"><span class="rl">Late registration</span>'+
    '<span style="color:var(--warn);font-weight:700">+$'+CFG.tierAdjust+'</span></div>';
  return '';
}
/* $5,000, matching MAX_DONATION_CENTS in Pricing.gs. test/donation.test.js asserts the
   two agree -- this is a second copy of a server rule, which is exactly the shape that
   drifts, so it is pinned by a test rather than by a comment. */
var MAX_DONATION=5000;
/** One parse, used by the field, the fee box and the payload. '' for anything unusable. */
function donationRaw(){ return String(s.shared.donation||'').trim().replace(/[$,]/g,''); }
function donationNum(){ var n=parseFloat(donationRaw()); return (isFinite(n)&&n>0)?Math.round(n*100)/100:0; }
/* Empty is fine -- the donation is optional. Anything else must be a plain dollar amount
   within the cap, and must SAY so: the old field silently coerced junk to 0, so a family
   who typed "fifty" saw their donation vanish from the total with no explanation. */
function donationError(){
  var raw=donationRaw();
  if(!raw) return '';
  if(!/^\d+(\.\d{1,2})?$/.test(raw))
    return 'Enter a dollar amount, like 50 or 50.00.';
  var n=parseFloat(raw);
  if(n>MAX_DONATION)
    return 'Donations over $'+MAX_DONATION.toLocaleString()+' need to go through the '+
           'registrar. Please leave this blank and email '+
           ((CFG&&CFG.registrarEmail)||'info@piedmontbaseball.org')+'.';
  return '';
}
/* Dollars for display, via money(): a 50% combo line can be $212.50, and '$'+number
   printed that as "$212.5". */
function total(){ return money(totalCents()); }

function renderSteps(){ var el=document.getElementById('steps'); el.innerHTML='';
  for(var i=0;i<TOTAL_STEPS;i++){ var d=document.createElement('div');
    d.className='dot'+(i<s.step?' done':'')+(i===s.step?' on':''); el.appendChild(d);} }

function esc(v){return (v==null?'':String(v)).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}

/* THE BINDING CONVENTION. f_<key> writes shared[key]; f_p<i>_<key> writes players[i][key].
   A field whose id does not match simply never persists and nothing errors -- this is the
   single most likely source of silent breakage in the whole form, which is why the
   round-trip test exists. */
/* The asterisk was the ONLY signal that a field was required, and nothing anywhere said
   what it meant -- a parent registering for real told us they did not know. Shown once
   per step, above the first field, on the two steps that have required fields. */
function reqLegend(){ return '<p class="help" style="margin:-2px 0 10px">Fields marked '+
  '<span class="req">*</span> are required.</p>'; }

/* aria-required carries the requirement for anyone the colour cannot reach, and the
   asterisk is hidden from assistive tech so it is not read out as a bare "star" with no
   meaning attached. Both helpers already thread `req`, so this is one argument. */
function reqMark(req){ return req?' <span class="req" aria-hidden="true">*</span>':''; }
function reqAttr(req){ return req?' aria-required="true"':''; }
function sfield(label,key,type,req,ph,attrs){ return '<div class="q"><label class="qt">'+label+
  reqMark(req)+'</label><input id="f_'+key+'" type="'+(type||'text')+'"'+reqAttr(req)+
  (attrs||'')+' placeholder="'+(ph||'')+'" value="'+esc(s.shared[key])+'"></div>'; }
function pfield(i,label,key,type,req,ph,attrs){ return '<div class="q"><label class="qt">'+label+
  reqMark(req)+'</label><input id="f_p'+i+'_'+key+'" type="'+(type||'text')+'"'+reqAttr(req)+
  (attrs||'')+' placeholder="'+(ph||'')+'" value="'+esc(s.players[i][key])+'"></div>'; }
function sel(id,cur,arr,req){ return '<select id="'+id+'"'+reqAttr(req)+'>'+arr.map(function(v){
  /* [value,label] pairs where the stored value is not what a parent reads ('PK' is
     shown as Pre-K); a bare value is both. */
  var val=Array.isArray(v)?v[0]:v, lab=Array.isArray(v)?v[1]:v;
  return '<option value="'+esc(val)+'"'+(String(cur)===String(val)?' selected':'')+'>'+lab+
    '</option>';}).join('')+'</select>'; }

function bindInputs(){
  Array.prototype.forEach.call(document.querySelectorAll('input[id^="f_"],select[id^="f_"],textarea[id^="f_"]'),
  function(el){
    var id=el.id.slice(2), m=id.match(/^p(\d+)_(.+)$/);
    var h=function(){
      if(m){ var i=Number(m[1]); if(s.players[i]) s.players[i][m[2]]=el.value; }
      else { s.shared[id]=el.value; }
      /* Grade selects the division and therefore the price, so the card has to be
         redrawn -- updateNext() alone would leave the fee box stale or absent.
         Text inputs deliberately do NOT re-render: that would drop focus mid-word. */
      // Grade/school redraw the card; refocus, or arrowing through the select loses focus.
      if(m && (m[2]==='grade' || m[2]==='school') && s.players[Number(m[1])])
        applyAutoSport(s.players[Number(m[1])]);
      if(m && (m[2]==='grade' || m[2]==='school')){
        render(); var again=document.getElementById(el.id); if(again) again.focus(); }
      // Donation used to render() here, destroying the field mid-word. It repaints the
      // error and the totals in place instead.
      else if(id==='donation') paintDonation();
      else { updateNext(); if(s.step===0) paintErrors(); }
    };
    el.oninput=h; el.onchange=h;
  });
}

/* Mirrors normalizeDob() in Pricing.gs -- test/dob.test.js asserts the two agree on
   every case, because two parsers for one format is exactly the shape that drifts. */
/* NO local copy of the year window. It rolls each season, and two copies of a rolling
   rule is a rule that drifts on New Year's Day in whichever copy nobody remembered.
   doGet computes it from the same clock that resolves the tier and sends it down. */
function birthYears(){
  return { min:(CFG&&CFG.minBirthYear)||null, max:(CFG&&CFG.maxBirthYear)||null };
}
function normalizeDob(raw){
  var v=String(raw==null?'':raw).trim();
  if(!v) return null;
  var m,y,mo,d;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=v.match(/^(\d{1,2})[\/\-. ]+(\d{1,2})[\/\-. ]+(\d{4})$/))){ mo=+m[1]; d=+m[2]; y=+m[3]; }
  else if((m=v.match(/^(\d{2})(\d{2})(\d{4})$/))){ mo=+m[1]; d=+m[2]; y=+m[3]; }
  else return null;
  if(mo<1||mo>12||d<1||d>31) return null;
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return null;
  function pad(n){ return (n<10?'0':'')+n; }
  return y+'-'+pad(mo)+'-'+pad(d);
}
/** Mirrors dobProblem() in Pricing.gs. '' when fine; "invalid" tells a parent nothing. */
function dobError(p){
  var raw=String(p.dob||'').trim();
  if(!raw) return '';                          // handled as "needs a birthdate"
  var iso=normalizeDob(raw);
  if(!iso) return 'We could not read that as a date. Please use mm/dd/yyyy \u2014 for '+
                  'example 05/14/2016. Slashes, dashes or spaces all work.';
  var w=birthYears();
  if(!w.min||!w.max) return '';                // server did not say; do not invent a rule
  var y=+iso.slice(0,4);
  if(y<w.min) return 'That is a '+y+' birth year, which would make them too old for '+
                     'this season. Please check the year \u2014 if it is right, email '+
                     ((CFG&&CFG.registrarEmail)||'info@piedmontbaseball.org')+
                     ' rather than registering here.';
  if(y>w.max) return 'That is a '+y+' birth year, which would make them too young for '+
                     'this season. Please check the year.';
  return '';
}
/** mm/dd/yyyy for display, from anything normalizeDob accepts. '' if unusable. */
function dobDisplay(raw){
  var iso=normalizeDob(raw);
  if(!iso) return '';
  return iso.slice(5,7)+'/'+iso.slice(8,10)+'/'+iso.slice(0,4);
}

/* Returns a human sentence naming WHICH child is blocking, or null. A disabled button
   with no explanation is the worst version of validation. */
function playerProblem(i){
  var p=s.players[i], who='Player '+(i+1)+(p.first?' ('+p.first+')':'');
  if(!p.first||!p.last) return who+' needs a first and last name';
  if(!p.dob) return who+' needs a birthdate';
  var de=dobError(p); if(de) return who+': '+de;
  if(!p.gender) return who+' needs a gender';
  if(!p.grade) return who+' needs a grade';
  /* School before programs: PMS eligibility depends on it. */
  if(!p.school) return who+' needs a school';
  if(pMulti(p)){
    var mix=programMixProblem(pPrograms(p));
    if(mix) return who+': '+mix;
  } else {
    if(!pSport(p)) return who+' needs a sport';
    if(!pDivision(p)) return who+' has no division for that sport and grade';
  }
  if(!p.shirt) return who+' needs a shirt size';
  return null;
}
function firstPlayerProblem(){
  for(var i=0;i<s.players.length;i++){ var e=playerProblem(i); if(e) return e; }
  return null;
}

function addPlayer(){ if(s.players.length<MAX_PLAYERS){ s.players.push(blankPlayer()); render(); } }
function removePlayer(i){ if(s.players.length>1){ s.players.splice(i,1); render(); } }

  h+='<div class="help" id="dobhint_'+i+'" style="margin:-8px 0 4px">'+

     sel('f_p'+i+'_school',p.school,SCHOOLS,true)+'</div>';
  if(multi){
    var el=eligiblePrograms(p,CFG), want=p.programs||[], hasSchool=false;
    h+='<div class="q"><label class="qt">Programs <span class="req" aria-hidden="true">*</span> '+

/* One child's fee box. Repainted in place when a program box is ticked -- render()
   would destroy the checkbox the parent is standing on (CLAUDE.md traps). */
function playerFeeRows(p){
  var es=pEntries(p), h='';
  for(var k=0;k<es.length;k++){
    h+='<div class="frow"><span class="rl"><b>'+esc(divLabel(es[k].division))+'</b>'+
      (CFG.schoolPrograms&&CFG.schoolPrograms[es[k].division]?'':' &middot; '+es[k].sport)+
      (es[k].off?' <span class="chip">2nd program &minus;'+CFG.comboDiscountPercent+'%</span>':'')+
      '</span><span class="fee">'+money(es[k].cents)+'</span></div>';
  }
  return es.length?h+tierNote():'<div class="help">Pick at least one program.</div>';
}
/* Tells a family WHY a PMS program is missing, instead of letting it silently not exist:
   the grade and gender qualify, but the school picked is not the program's school. */
function pmsHint(p){
  if(!CFG||!CFG.schoolPrograms) return '';
  var g=gradeKey(p.grade), out=[];
  for(var name in CFG.schoolPrograms){ var r=CFG.schoolPrograms[name];
    if(r.gender===p.gender&&g!==null&&(r.grades||[]).indexOf(g)>=0&&p.school!==r.school)
      out.push(esc(divLabel(name))+' is for '+esc(r.school)+' students');
  }
  return out.length?'<div class="help">'+out.join('; ')+' &mdash; pick that school above '+
    'to see it.</div>':'';
}
/* Ticking a program: update the model and repaint the numbers IN PLACE. */
function wirePrograms(){
  Array.prototype.forEach.call(document.querySelectorAll('input[data-prog]'),function(cb){
    cb.onchange=function(){
      var i=Number(cb.getAttribute('data-prog')), list=[];
      /* One rec program per child: ticking a rec box clears the other rec box, in place. */
      if(cb.checked&&cb.getAttribute('data-school')==='0')
        Array.prototype.forEach.call(document.querySelectorAll('input[data-prog="'+i+'"][data-school="0"]'),
          function(x){ if(x!==cb) x.checked=false; });
      Array.prototype.forEach.call(document.querySelectorAll('input[data-prog="'+i+'"]'),
        function(x){ if(x.checked) list.push(x.value); });
      s.players[i].programs=list;
      var box=document.getElementById('pfee_'+i);
      if(box) box.innerHTML=playerFeeRows(s.players[i]);
      paintStepTotal(); updateNext();
    };
  });
}
function stepTotalRow(){
  var n=entryCount();
  return '<div class="frow"><span class="rl">'+s.players.length+' player'+
    (s.players.length>1?'s':'')+(n>s.players.length?' &middot; '+n+' programs':'')+
    (procMandatory()?' &middot; incl. processing':'')+'</span><span class="fee">'+
    money(subtotalCents()+procCents())+'</span></div>';
}
function paintStepTotal(){ var t=document.getElementById('steptotal'); if(t) t.innerHTML=stepTotalRow(); }

function wirePlayerCards(){
  bindInputs();
  /* Tidy the birthdate to mm/dd/yyyy when the parent leaves the field, so "5 14 2016"
     and "5-14-2016" both end up looking like the placeholder and nobody has to wonder
     whether their separator was accepted.

     onblur, NOT oninput -- reformatting mid-typing fights backspace and moves the caret.
     And it sets .value only: this is emphatically NOT a re-render, which is forbidden on
     blur here because it destroys the field being tabbed out of. The node survives, so
     keyboard navigation is unaffected. */
  Array.prototype.forEach.call(document.querySelectorAll('input[id$="_dob"]'),function(el){
    var m=el.id.slice(2).match(/^p(\d+)_/);
    var idx=m?+m[1]:null;
    el.oninput=function(){
      if(idx!==null&&s.players[idx]) s.players[idx].dob=el.value;
      paintDob(idx); updateNext();
    };
    el.onblur=function(){
      var tidy=dobDisplay(el.value);
      if(tidy&&tidy!==el.value){
        el.value=tidy;
        if(idx!==null&&s.players[idx]) s.players[idx].dob=tidy;
      }
      paintDob(idx); updateNext();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.opt[tabindex]'),function(o){
    o.onkeydown=function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); o.click(); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-gender] .opt'),function(o){
    o.onclick=function(){ var i=Number(o.parentNode.getAttribute('data-gender'));
      s.players[i].gender=o.dataset.v;
      applyAutoSport(s.players[i]);
      render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sport] .opt'),function(o){
    o.onclick=function(){ var i=Number(o.parentNode.getAttribute('data-sport'));
      if(s.players[i].gender==='Male') return;
      s.players[i].sport=o.dataset.v; s.players[i].sportAuto=false; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.rmbtn'),function(b){
    b.onclick=function(){ removePlayer(Number(b.getAttribute('data-rm'))); };
  });
  wirePrograms();
  var add=document.getElementById('addPlayer');
  if(add) add.onclick=addPlayer;
}

/* Five entries, not one blanket checkbox -- see docs/adr/0011. The four risk and
   consent documents stay separate because separateness is what makes each one
   conspicuous; the four administrative acknowledgements merged into 'rules',
   their texts concatenated verbatim. Three are load-bearing rather than
   paperwork: the medical release authorises emergency treatment, the concussion
   waiver exists because California AB 2007 requires youth sports organisations
   to carry one, and the COVID waiver is a release. Text is transcribed verbatim
   from test/fixtures/ and asserted by test/waivers.test.js -- never edit here. */
/* Attribution, mirrored from waiverValueOk() in backend/Pricing.gs. Duplicated
   deliberately: the client copy exists so a family sees the problem while they
   are looking at the field, and the server copy is the one that decides. Keep
   the two identical -- if they drift, the form accepts what the server rejects
   and the family hits it only at submit, having filled in everything. */
var NAME_SUFFIXES={jr:1,sr:1,ii:1,iii:1,iv:1,v:1,md:1,phd:1};
function normName(v){
  return String(v==null?'':v)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[.,\-'\u2018\u2019]/g,' ').replace(/\s+/g,' ').trim();
}
function nameParts(n){
  var s2=normName(n); if(!s2) return [];
  var p=s2.split(' ');
  if(p.length>1&&NAME_SUFFIXES[p[p.length-1]]) p=p.slice(0,-1);

}

  var p=nameParts(n); if(!p.length) return [];

}

  var out=[];

}
/* A free-text box accepts "x" and records a consent identifying nobody. Matching

  if(mode!=='signature'&&mode!=='initials') return false;   /* fail closed */

  var flat=v.replace(/ /g,'');

    var nf=nameForms(names[i]);

/* Generic on purpose. An earlier version pre-filled the parent's own name, which

}
function wireWaivers(){
  Array.prototype.forEach.call(document.querySelectorAll('input[id^="w_"]'),function(el){
    var key=el.id.slice(2);
    el.oninput=function(){
      /* The client timestamp is the browser's clock and is both forgeable and often
         simply wrong; the server records its own alongside it. Kept because it shows
         the order the family signed in. */
      s.waivers[key]={value:el.value, at:new Date().toISOString(), version:WAIVER_VERSION};
      /* Update the chip in place. An earlier version re-rendered the step on blur,
         which destroyed the DOM mid-tab and dropped focus -- that is precisely why
         tabbing between waiver fields did not work. Never re-render on blur. */
      var w=null;
      for(var i=0;i<WAIVERS.length;i++) if(WAIVERS[i].key===key) w=WAIVERS[i];

         feedback is a chip and a colour, and Next simply stays disabled. */
      if(w) el.setAttribute('aria-invalid',

}

/* Cover page. Money figures come from CFG so they cannot drift from what the server
   actually charges -- the one thing on this page that must never be a stale hardcode. */
/* Deliberately permissive. The job is to catch a typo or a missing field, not to
   police formats -- an over-strict rule rejects a real family and they simply leave. */
function okEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }
function okPhone(v){ var d=String(v||'').replace(/\D/g,'');
  return d.length===10 || (d.length===11 && d.charAt(0)==='1'); }
/* ZIP+4 is a real ZIP. A family who knows theirs types it, with or without the hyphen,
   and the old exact-5-digit rule turned them away with a greyed-out Next (#41).
   normZip returns the one stored shape, 94611 or 94611-1234, or null; the box keeps
   what they typed and the payload carries the normal form, so the sheet gets one shape. */
function normZip(v){ var m=String(v||'').trim().match(/^(\d{5})(?:[- ]?(\d{4}))?$/);
  return m ? (m[2] ? m[1]+'-'+m[2] : m[1]) : null; }
function okZip(v){ return normZip(v)!==null; }
function withNormalZip(x){ var o={},k; for(k in x) o[k]=x[k];
  if(normZip(x.zip)) o.zip=normZip(x.zip); return o; }
/* Step 0's Next gate, named so the test suite can run it rather than grep for it. */
function familyComplete(x){
  return !!(x.addr&&x.city&&x.state&&okZip(x.zip)&&
    x.p1name&&x.p1rel&&okEmail(x.p1email)&&okPhone(x.p1cell)&&
    (!x.p2email||okEmail(x.p2email))&&(!x.p2cell||okPhone(x.p2cell))&&
    x.ec_name&&okPhone(x.ec_phone)&&x.hospital&&x.physName&&okPhone(x.physPhone)&&
    x.insCarrier&&x.policyHolder&&x.policyNumber); }
/* "Did you mean…?" for typos of the big mail providers -- SUGGEST ONLY. A typo'd domain
   (jane@gamil.com) is a valid address shape, so okEmail cannot catch it, and the family
   then never gets a confirmation. We never block and never auto-change: an unusual
   domain is often a real one, so the family can always keep what they typed.
   Matching is edit distance (a swap counts as one edit) against this list, with a tighter
   limit for short domains, plus real near-misses that must never be "corrected". */
var EMAIL_PROVIDERS=['gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','me.com',
  'mac.com','aol.com','comcast.net','att.net','sbcglobal.net','sonic.net'];
var EMAIL_REAL_LOOKALIKES=['mail.com','email.com','ymail.com','gmx.com','live.com','msn.com',
  'aon.com','yahoo.ca','yahoo.co.uk','hotmail.ca','hotmail.co.uk','outlook.ca','att.com',
  'comcast.com','mac.org','cloud.com','me.org'];
function editDistance(a,b){
  var d=[],i,j;
  for(i=0;i<=a.length;i++){ d[i]=[i]; }
  for(j=0;j<=b.length;j++){ d[0][j]=j; }
  for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++){
    var c=(a.charAt(i-1)===b.charAt(j-1))?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a.charAt(i-1)===b.charAt(j-2)&&a.charAt(i-2)===b.charAt(j-1))
      d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
/* The corrected address, or null when there is nothing to suggest. */
function emailSuggestion(v){
  var t=String(v==null?'':v).trim(), at=t.lastIndexOf('@');
  if(at<1||at===t.length-1) return null;
  var local=t.slice(0,at), dom=t.slice(at+1).toLowerCase();
  if(/[\s@]/.test(local)) return null;            // not an address anyway; okEmail says so
  if(EMAIL_PROVIDERS.indexOf(dom)>=0||EMAIL_REAL_LOOKALIKES.indexOf(dom)>=0) return null;
  var dot=dom.lastIndexOf('.'), name=dot<0?dom:dom.slice(0,dot);
  var best=null,bestD=99,i;
  for(i=0;i<EMAIL_PROVIDERS.length;i++){
    var p=EMAIL_PROVIDERS[i], pname=p.slice(0,p.lastIndexOf('.'));
    if(dot<0&&(dom+'.com'===p||dom+'.net'===p)) return local+'@'+p;   // jane@gmail
    if(name===pname) return local+'@'+p;                               // gmail.net, sbcglobal.com
    /* Short provider names (me, mac, aol, att) sit one letter from real work domains --
       ge.com, mmc.com, man.com -- so for those only a swapped pair counts (mca.com). */
    if(pname.length<=3){
      if(name.length===pname.length&&editDistance(name,pname)===1&&
         name.split('').sort().join('')===pname.split('').sort().join(''))

var _emailKept={};
function paintEmailSuggestion(key){

  if(old&&old.getAttribute('data-for')===v&&sug&&_emailKept[key]!==v) return;

    '<button type="button" class="use">Use '+esc(sug.slice(sug.lastIndexOf('@')+1))+'</button>'+
    '<button type="button" class="keep">Keep mine</button>';

/* Both tier prices per division, derived from the server's own table. fees[] in

   show a family what it costs before and after the deadline. No fee constant

   the table renders without price columns rather than throwing, because a thrown
   error inside render() is silence, not a message. */
function tierAdjust(){
  if(!CFG||!CFG.tiers) return null;
  var adj={};
  for(var i=0;i<CFG.tiers.length;i++) adj[CFG.tiers[i].name]=CFG.tiers[i].adjust;
  return adj;
}
function tierPrices(){
  if(!CFG||!CFG.standardFees||!CFG.tiers) return null;
  var adj=tierAdjust();
  if(!adj||adj.early==null||adj.standard==null) return null;
  var out={};
  for(var d in CFG.standardFees){
    var row={};
    for(var n in adj) row[n]=CFG.standardFees[d]+adj[n];
    out[d]=row;
  }
  return out;
}
var TIER_LABELS={early:'Early bird',standard:'Standard',late:'Late'};
var TIER_ORDER={early:0,standard:1,late:2};
/* Which two columns to show. Always exactly one is in force: an earlier version
   showed Early and Standard at every tier, so from September 5 the whole table
   rendered struck through and the payable price appeared nowhere. */
function coverCols(){
  return (CFG&&CFG.tier==='late') ? ['standard','late'] : ['early','standard'];
}
function colClass(name){
  var tier=CFG?CFG.tier:null;
  if(name===tier) return ' now';
  return (TIER_ORDER[name]<TIER_ORDER[tier]) ? ' past' : '';
}

    if(P) for(var c2=0;c2<cols.length;c2++){

    }

/* Back to the top whenever the SCREEN changes: cover to Family, step to step on Next or
   Back, and the review to the saved screen. A family who presses Next at the bottom of
   a long step then starts the next one at its heading, not halfway down it (PBSF

   gender, adding a player), which must leave the page where it is, and not on the first
   paint. In the Wix embed the form scrolls inside its own short frame: scrollTo moves
   the frame, and scrollIntoView on the header also scrolls the Wix page until the

var _screen=null;
