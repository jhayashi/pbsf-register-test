  try{ window.scrollTo(0,0); }catch(e){}
  var top=document.querySelector('header');
  if(top&&top.scrollIntoView){ try{ top.scrollIntoView({block:'start'}); }catch(e){} }
}

function render(){
  var st=document.getElementById('stage');
  toTopOnNewScreen();
  if(s.intro){
    document.getElementById('steps').innerHTML='';
    st.innerHTML=coverPage();
    document.getElementById('begin').onclick=function(){ s.intro=false; render(); };
    return;
  }
  renderSteps();

  if(s.step===0){
    st.innerHTML='<h2>Family &amp; Contact</h2><p class="sub">Who we contact about your '+
      'child&rsquo;s team, and who we call in an emergency. You enter this once &mdash; it '+
      'applies to every child you register.</p>'+reqLegend()+
      '<h2 style="margin-top:4px">Parent / Guardian 1</h2>'+
      '<div class="row"><div class="q"><label class="qt">Name <span class="req" aria-hidden="true">*</span></label>'+
      '<input id="f_p1name" type="text" aria-required="true" value="'+esc(s.shared.p1name)+'"></div>'+
      '<div class="q"><label class="qt">Relationship <span class="req" aria-hidden="true">*</span></label>'+
      sel('f_p1rel',s.shared.p1rel,RELATIONS,true)+'</div></div>'+
      '<div class="row">'+sfield('Email','p1email','email',true)+sfield('Cell phone','p1cell','tel',true)+'</div>'+
      '<h2 style="margin-top:18px">Parent / Guardian 2 <span class="chip">optional</span></h2>'+
      '<div class="row"><div class="q"><label class="qt">Name</label>'+
      '<input id="f_p2name" type="text" value="'+esc(s.shared.p2name)+'"></div>'+
      '<div class="q"><label class="qt">Relationship</label>'+
      sel('f_p2rel',s.shared.p2rel,RELATIONS)+'</div></div>'+
      '<div class="row">'+sfield('Email','p2email','email',false)+sfield('Cell phone','p2cell','tel',false)+'</div>'+
      '<h2 style="margin-top:18px">Home Address</h2>'+
      sfield('Street address','addr','text',true)+
      '<div class="row">'+sfield('City','city','text',true)+sfield('State','state','text',true)+
      /* No placeholder. A real parent read the greyed example as a pre-filled
         value and left it, so the example cost more than it explained. */
      sfield('ZIP','zip','text',true)+'</div>'+
      '<h2 style="margin-top:18px">Emergency &amp; Medical</h2>'+
      '<div class="row">'+sfield('Emergency contact','ec_name','text',true)+sfield('Emergency phone','ec_phone','tel',true)+'</div>'+
      sfield('Preferred hospital','hospital','text',true)+
      '<div class="row">'+sfield('Physician name','physName','text',true)+sfield('Physician phone','physPhone','tel',true)+'</div>'+
      '<h2 style="margin-top:18px">Insurance</h2>'+
      sfield('Insurance carrier','insCarrier','text',true)+
      '<div class="row">'+sfield('Name of policy holder','policyHolder','text',true)+
      sfield('Policy number','policyNumber','text',true)+'</div>'+
      nav(false,'Next: Players');
    bindInputs();
    paintErrors();
    wireEmailSuggestions();
    wireNext(function(){ return familyComplete(s.shared); },
      'Complete every required family field. ZIP must be 5 digits or ZIP+4; emails and phone numbers must be valid.');
  }

  else if(s.step===1){
    var cards='';
    for(var i=0;i<s.players.length;i++) cards+=playerCard(i);
    st.innerHTML='<h2>Players</h2><p class="sub">Add each child you are registering &mdash; '+
      'up to '+MAX_PLAYERS+' in one go. Division and fee are worked out from grade and '+
      'sport, so each child is priced for their own division.</p>'+reqLegend()+cards+
      (s.players.length<MAX_PLAYERS
        ? '<button class="ghost" id="addPlayer" style="width:100%;margin-bottom:6px">+ Add another player</button>'
        : '<div class="help">Maximum '+MAX_PLAYERS+' players per registration.</div>')+
      '<div class="feebox" id="steptotal">'+stepTotalRow()+'</div>'+
      nav(true,'Next: Review');
    wirePlayerCards();
    wireNext(function(){ return !firstPlayerProblem(); }, '');
  }

  else if(s.step===2){
    var cards='';
    for(var w=0;w<WAIVERS.length;w++) cards+=waiverCard(WAIVERS[w]);
    /* Counted, not spelled. This said "All eight" above five cards for the whole
       of the regroup, because no test asserts prose and a green suite says
       nothing about a sentence. */
    st.innerHTML='<h2>Waivers</h2><p class="sub">All '+WAIVERS.length+' are required, and cover every '+
      'child on this registration. Open each one, read it, then sign it by typing your '+
      'full name &mdash; exactly as you entered it on the Family step.</p>'+cards+
      nav(true,'Next: Review');
    wireWaivers();
    wireNext(function(){ return waiversRemaining()===0; },'');
  }

  else if(s.step===3){
    var lines=entryLines();
    st.innerHTML='<h2>Review</h2><p class="sub">Check every child before paying. Use Back '+
      'to change anything &mdash; nothing has been charged yet.</p>'+
      '<div class="rev"><b>Family:</b> '+esc(s.shared.p1name)+'<br>'+
      '<b>Address:</b> '+esc(s.shared.addr)+', '+esc(s.shared.city)+' '+esc(s.shared.zip)+'</div>'+
      confirmationsLine()+
      /* type=text, NOT type=number. The spinner arrows invite click-to-increment on a
         field nobody nudges by one, and type=number silently discards what it cannot
         parse -- so a typo becomes an empty box rather than a message. inputmode gets
         the numeric keypad on a phone without any of that. */
      '<section class="donbox" aria-labelledby="donHead">'+
        '<div class="donhead" id="donHead">Support PBSF <span class="chip">Optional</span></div>'+
        '<p class="dontext">PBSF is a non-profit run entirely by parent volunteers. If you would '+
        'like to give a little extra, any amount helps &mdash; donations are tax-deductible. '+
        'Tap an amount to add it, tap it again to remove it, or skip this entirely.</p>'+
        donationPicks()+
        /* Other reveals the free amount field; it stays in the DOM (hidden) so bindInputs
           binds it once, and its handler repaints in place exactly as before. */
        '<div id="donOther"'+(s.donChoice==='other'?'':' hidden')+'>'+
        sfield('Donation amount ($)','donation','text',false,'0',
               ' inputmode="decimal" autocomplete="off" aria-describedby="donErr"')+
        '</div>'+
        '<div id="donErr"></div>'+
      '</section>'+
      '<div class="feebox" id="feebox">'+feeboxRows(lines)+'</div>'+
      nav(true,'Next: Payment');
    bindInputs();
    wireDonation();
    wireConfirmationFixes();
    paintDonation();
    wireNext(function(){ return s.players.length>0 && !firstPlayerProblem()
                                && !donationError(); },'');
  }

  else if(s.step===4){
    if(s.saved){ st.innerHTML=savedNotPayableScreen(); return; }
    st.innerHTML='<h2>Payment</h2><p class="sub">You will be taken to our payment page '+
      'to finish. Your registration is saved first, so nothing is lost if the payment '+
      'does not go through.</p>'+
      supportBox()+
      '<div class="amt">$'+totalWithSupport()+'</div>'+
      '<button class="primary" id="payBtn" style="width:100%">Continue to payment</button>'+
      '<div id="submitErr"></div>'+
      '<div class="nav"><button class="ghost" id="back">Back</button></div>';
    document.getElementById('back').onclick=function(){ s.step=3; render(); };
    var sup=document.getElementById('f_support');
    /* Update the total IN PLACE. render() rebuilds step 4 wholesale, which destroys the
       checkbox the user just operated and drops focus to <body> -- a keyboard user tabs
       here, presses Space, and loses their place in the document. Same failure the
       "never re-render on blur" rule exists to prevent, different event. */
    if(sup) sup.onchange=function(){
      s.support=this.checked;
      var amt=document.querySelector('.amt');
      if(amt) amt.textContent='$'+totalWithSupport();
    };
    var pay=document.getElementById('payBtn');
    pay.onclick=function(){ pay.disabled=true; pay.textContent='Submitting…';
      submitToBackend().then(function(r){
        if(r&&r.ok&&r.checkoutUrl){
          pay.textContent='Taking you to payment…';
          /* Painted BEFORE navigating, because a blocked navigation is silent -- see
             goToCheckout. If the redirect works this page is gone and nobody reads it. */
          document.getElementById('submitErr').innerHTML=
            '<div class="enf" style="text-align:left"><b>Your registration is saved.</b> '+
            'If you are not taken to the payment page automatically, '+
            '<a href="'+esc(r.checkoutUrl)+'" target="_top" rel="noopener">open it '+
            'here</a> to finish.</div>';
          pay.disabled=false; pay.textContent='Continue to payment';
          goToCheckout(r.checkoutUrl);   // leaves this page, if the browser allows it
          return;
        }
        if(r&&r.ok){
          /* ok WITHOUT a checkoutUrl means saved-but-not-payable: Stripe was
             unreachable, or payment is not configured yet. The rows exist, so this is
             not a failure and must not read like one -- note the lock-timeout message
             says "nothing has been saved yet", which is true there and false here. */
          s.saved=true; s.result=r; render(); return;
        }
        document.getElementById('submitErr').innerHTML=
          '<div class="valerr">'+esc((r&&r.error)||'Submission failed.')+'</div>';
        pay.disabled=false; pay.textContent='Submit registration';
      }); };
  }
}

/* Voluntary, unchecked by default, and the wording says "help cover" rather than
   "cover". Both matter: the unchecked default and the "(optional)" are the only things
   distinguishing this from a card surcharge, and California surcharging law is
   unsettled enough to want to stay clearly on the other side of it. The figure is also
   computed BEFORE any aid code is entered on Stripe's page, so an aid family
   over-contributes -- "help cover" is honest about that where "cover" would not be. */
function supportCents(){
  if(!CFG||!CFG.processingFeeRate) return 0;
  var base=Math.round((subtotalCents()+Math.round(donationNum()*100)));
  if(base<=0) return 0;
  var rate=CFG.processingFeeRate, fixed=CFG.processingFeeFixedCents;
  var add=Math.floor((base+fixed)/(1-rate))-base-1;
  if(add<0) add=0;
  for(var i=0;i<8;i++){
    var net=(base+add)-(Math.round((base+add)*rate)+fixed);
    if(net>=base) return add;
    add++;
  }
  return add;
}
function subtotalCents(){
  // pFee is the form's existing per-player fee lookup -- reuse it rather than
  // recomputing the division, or the two answers drift and the checkbox quotes a
  // support figure against a subtotal the review step never showed.
  return s.players.reduce(function(t,p){ return t+pFeeCents(p); },0);
}
function totalWithSupport(){
  var c=procMandatory()?totalCents()
    :subtotalCents()+Math.round(donationNum()*100)+(s.support?supportCents():0);
  return (c/100).toFixed(2).replace(/\.00$/,'');
}
function supportBox(){
  if(procMandatory()) return '';   // spring: a required fee, itemised on the review step
  var c=supportCents();
  // >0, not truthiness: if processingFeeFixedCents is ever absent from doGet, supportCents
  // returns NaN and `!c` swallows it -- the checkbox silently never renders and there is
  // no way to notice. This at least fails the same way as a zero rate.
  if(!(c>0)) return '';
  return '<label class="supportbox"><input type="checkbox" id="f_support"'+
    (s.support?' checked':'')+'>'+
    '<span class="sbtext">Add <b>'+money(c)+'</b> to help cover the card processing fee '+
    '<i>(optional)</i><br><span class="sbnote">'+
    'PBSF is a parent-volunteer run non-profit organization. Card processing costs '+
    'the league about this much per registration.</span></span></label>';
}

/* Reached only when the server answered ok WITHOUT a checkoutUrl: the rows exist and
   Stripe was unreachable or is not configured. NOT an error screen -- the registration
   genuinely is saved -- and deliberately different from the lock-timeout message, which
   says "nothing has been saved yet". */
function savedNotPayableScreen(){
  var to=esc(s.shared.p1email);
  return '<div class="succ"><div class="big">✅</div><h2>Your registration is saved</h2>'+
    '<p class="sub">We could not reach the payment system just now, so you have not '+
    'been charged.</p>'+
    '<div class="enf" style="text-align:left"><b>Nothing more to do right now.</b> '+
    'We will email <b>'+to+'</b> a link to finish paying. Your place is not held until '+
    'payment is received.</div>'+
    '<p class="sub" style="font-size:12px">Reference: '+
    esc((s.result&&s.result.groupId)||'')+'</p></div>';
}

function confirmScreen(){
  var names=s.players.map(function(q){ return esc(q.first)+' '+esc(q.last); }).join(', ');
  var to=esc(s.shared.p1email);
  return '<div class="succ"><div class="big">🎉</div><h2>Registration received</h2>'+
    '<div class="badge-paid">'+s.players.length+' player'+(s.players.length>1?'s':'')+' &middot; '+total()+'</div>'+
    '<p class="sub">'+names+'</p>'+

    '<div class="enf" style="text-align:left">'+
    '<b>Check your email.</b> A confirmation is on its way to <b>'+to+'</b> with your '+
    'players, divisions and fees. It usually arrives within a few minutes &mdash; if you '+
    'do not see it, check your spam folder.'+
    '</div>'+

    /* Accurate for the pre-Stripe state. When payment lands this becomes the receipt
       line; saying "you are registered" before money has moved is the version of this
       screen that gets a child left off a roster. */
    '<div class="valerr" style="text-align:left;margin-top:10px">'+
    '<b>Payment is not complete yet.</b> Online payment is not switched on for this '+
    'season yet, so your place is not held until we hear from you. We will follow up '+
    'with payment instructions. Questions: <a href="mailto:'+esc(CFG.registrarEmail)+'">'+
    esc(CFG.registrarEmail)+'</a>.'+
    '</div>'+

    '<div class="nav"><button class="primary" id="again">Register another family</button></div></div>';
}

function nav(showBack,label){ return '<div class="nav">'+
  (showBack?'<button class="ghost" id="back">Back</button>':'')+
  '<button class="primary" id="next" disabled>'+label+'</button></div>'; }

var _valid=function(){return true;}, _msg='';
function wireNext(fn,msg){ _valid=fn; _msg=msg||'';
  var n=document.getElementById('next'), b=document.getElementById('back');
  if(b) b.onclick=function(){ s.step--; render(); };
  if(n){ n.onclick=function(){ if(_valid()){ s.step++; s.paid=false; render(); } }; }
  updateNext(); }

/* Extracted so the donation field can refresh the total WITHOUT render(). render()
   rebuilds the step wholesale, which destroyed the input on every keystroke and dropped
   focus to <body> -- verified: typing "250" produced three separate nodes, none focused.
   The rule right above bindInputs' handler said text inputs must not re-render; the
   donation field was exempted from it and should not have been. */
function feeboxRows(lines){
  return lines+
    (donationNum()?'<div class="frow"><span class="rl">Donation</span><span>$'+
      donationNum()+'</span></div>':'')+
    '<div class="frow"><span class="rl"><b>Total due</b></span><span class="fee">'+
      total()+'</span></div>';
}

/** Repaint one child's birthdate error in place. Never re-renders -- see paintDonation. */
function paintDob(i){
  if(i===null||i===undefined) return;
  var box=document.getElementById('doberr_'+i);
  if(!box) return;
  var err=s.players[i]?dobError(s.players[i]):'';
  box.innerHTML=err?'<div class="valerr">'+esc(err)+'</div>':'';
  var el=document.getElementById('f_p'+i+'_dob');
  if(el) el.setAttribute('aria-invalid',err?'true':'false');
}

/* Where the receipt goes -- the server mails Parent 1 and copies Parent 2. Bold, on the
   last screen before money moves, because a typo here is a family who never hears back.
   Repeats the "Did you mean" check as a last chance. */
function confirmationsLine(){
  var seen={}, to=[];
  ['p1email','p2email'].forEach(function(k){ var x=String(s.shared[k]||'').trim();
    if(x&&!seen[x.toLowerCase()]){ seen[x.toLowerCase()]=true; to.push([k,x]); } });
  var h='<div class="revmail">Confirmations will go to '+to.map(function(e){
    return '<b>'+esc(e[1])+'</b>'; }).join(' and ')+'.';
  to.forEach(function(e){ var sg=emailSuggestion(e[1]);
    // "Keep mine" on the family step is an answer; do not ask again here.
    if(sg&&_emailKept[e[0]]!==s.shared[e[0]])
      h+='<div class="esugg" style="margin-top:6px">'+esc(e[1])+' &mdash; did you mean <b>'+
        esc(sg)+'</b>?<button type="button" class="use" data-fixkey="'+e[0]+'" data-fixv="'+
        esc(sg)+'">Use '+esc(sg.slice(sg.lastIndexOf('@')+1))+'</button></div>'; });
  return h+'</div>';
}
/* A click is the one moment a re-render is safe: the button is spent either way. */
function wireConfirmationFixes(){
  Array.prototype.forEach.call(document.querySelectorAll('.revmail button[data-fixkey]'),
    function(b){ b.onclick=function(){
      s.shared[b.getAttribute('data-fixkey')]=b.getAttribute('data-fixv'); render(); }; });
}

/* ---- Donation quick-picks. Nothing is preselected: a gift is opted into, never out of. */
var DONATION_PICKS=['25','50','100'];
/* Which pick an amount corresponds to -- for a family coming Back to this step. */
function donationChoiceFor(amount){
  var a=String(amount==null?'':amount).trim();
  if(!a) return null;
  return DONATION_PICKS.indexOf(a)>=0?a:'other';
}
/* Tapping a pick. The one already selected clears; Other starts empty for typing. */
function donationTap(cur,tapped){
  if(cur===tapped) return {choice:null,amount:''};
  return {choice:tapped,amount:tapped==='other'?'':tapped};
}
function donationPicks(){
  if(s.donChoice===undefined) s.donChoice=donationChoiceFor(s.shared.donation);
  var opts=DONATION_PICKS.map(function(v){ return [v,'$'+v]; }).concat([['other','Other']]);
  return '<div class="opts donpicks" role="radiogroup" aria-label="Donation amount" data-don>'+
    opts.map(function(o){ var on=(s.donChoice===o[0]);
      return '<div class="opt'+(on?' sel':'')+'" tabindex="0" role="radio" aria-checked="'+on+
        '" data-v="'+o[0]+'">'+o[1]+'</div>'; }).join('')+'</div>';
}
/* In place, like every other control on this step: render() would destroy the button the
   parent just tapped and drop focus to <body>. */
function wireDonation(){
  var f=document.getElementById('f_donation');
  if(f&&s.donChoice!=='other') f.value='';
  Array.prototype.forEach.call(document.querySelectorAll('[data-don] .opt'),function(o){
    o.onclick=function(){
      var t=donationTap(s.donChoice||null,o.getAttribute('data-v'));
      s.donChoice=t.choice; s.shared.donation=t.amount;
      Array.prototype.forEach.call(document.querySelectorAll('[data-don] .opt'),function(x){
        var on=(x.getAttribute('data-v')===s.donChoice);
        x.classList.toggle('sel',on); x.setAttribute('aria-checked',on?'true':'false'); });
      var other=document.getElementById('donOther'), fld=document.getElementById('f_donation');
      if(other) other.hidden=(t.choice!=='other');
      if(fld){ fld.value=(t.choice==='other')?t.amount:''; if(t.choice==='other') fld.focus(); }
      paintDonation();
    };
    o.onkeydown=function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); o.click(); } };
  });
}

/** Repaint the donation error and the totals in place. Never re-renders. */
function paintDonation(){
  var err=donationError();
  var box=document.getElementById('donErr');
  if(box) box.innerHTML=err?'<div class="valerr">'+esc(err)+'</div>':'';
  var el=document.getElementById('f_donation');
  if(el) el.setAttribute('aria-invalid',err?'true':'false');
  var fb=document.getElementById('feebox');
  if(fb) fb.innerHTML=feeboxRows(entryLines());
  updateNext();
}

function updateNext(){
  var n=document.getElementById('next'); if(!n) return;
  var problem=(s.step===1)?firstPlayerProblem():null;
  if(s.step===2){ var r=waiversRemaining();
    problem=r?(r+' waiver'+(r>1?'s':'')+' still to sign'):null; }
  n.disabled=!_valid();
  n.title=problem||_msg;
  var hint=document.getElementById('navHint');
  if(hint) hint.parentNode.removeChild(hint);
  if(n.disabled&&problem){
    var d=document.createElement('div'); d.id='navHint'; d.className='help';
    d.style.textAlign='right'; d.textContent=problem;
    n.parentNode.parentNode.insertBefore(d,n.parentNode);
  }
}

document.addEventListener('click',function(e){ if(e.target&&e.target.id==='again'){ location.reload(); }});
boot();
</script>
</body>
</html>
